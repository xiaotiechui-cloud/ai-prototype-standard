<script>
/* MODEL-START: pure model, also exercised by check_reference.py */
function createModel(){
  let rows=[{id:'r1',name:'同名资料',category:'A'},{id:'r2',name:'同名资料',category:'B'}],version=0,executions=0;
  const completed=new Set();
  return {
    snapshot:()=>({rows:rows.map(r=>({...r})),version,executions}),
    read:id=>{const row=rows.find(r=>r.id===id);return row?{...row}:null},
    save(id,draft,token,fail){
      if(completed.has(token))return {ok:false,error:'重复提交已拦截'};
      const at=rows.findIndex(r=>r.id===id);
      if(at<0)return {ok:false,error:'目标不存在，未替换记录'};
      if(!draft.name.trim())return {ok:false,error:'名称必填'};
      if(fail)return {ok:false,error:'模拟保存失败，草稿保留'};
      rows[at]={id,name:draft.name.trim(),category:draft.category};completed.add(token);version++;executions++;
      return {ok:true};
    }
  };
}
/* MODEL-END */
const $=s=>document.querySelector(s), model=createModel(), stack=[], locks=new Map();
let selected='RK-NOTE',outlined=false,serial=0;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const registry=[
  {id:'RK-NOTE',name:'行内备注',source:'当前用户；页面 note 草稿',action:'输入仅更新原生 textarea，不提交记录',states:'DEFAULT',result:'切评审工具后输入与滚动保持',test:'输入长文本，滚至中段后切组件与描边'},
  {id:'RK-LIST',name:'资料列表',source:'本地 fixture；rows[].id/name/category',action:'按稳定 ID 打开编辑层；缺失目标显示错误',states:'DEFAULT',result:'成功保存更新对应行；同名其他行不变',test:'编辑 r2，对照 r1 和数据版本'},
  {id:'RK-EDITOR',name:'编辑表单',source:'model.read(id) 的独立草稿',action:'本地校验后保存；可模拟失败、打开子选择器',states:'EDITING',result:'成功关闭；失败留草稿；脏退出提示',test:'子层 Esc 后核对父草稿；退出选继续/放弃'}
];
const headings=['功能/组件名称','数据来源','功能交互逻辑','界面反馈与体验表现','组件样式','状态变更','数据流转与接口','埋点和日志','测试与验收条件','待确认项'];
function renderDescription(){
  const c=registry.find(x=>x.id===selected),sections=[
    `组件：${c.id}\n名称：${c.name}\n页面：RK-01\n职责：${c.action}`,
    c.source,c.action,c.result,'业务正文 14px；触控最小热区按移动端基线；说明 13px、表格 12px。',
    `${c.states}；输入不写已保存记录；保存失败可重试，退出按脏数据规则。`,
    '仅本地内存，不调用接口；写回使用稳定 id，成功使 version 增加。',
    '本样例不设计业务埋点；保存执行次数仅用于本地动作连通核对。',c.test,'无新增业务待确认；真实浏览器行为尚未验收。'];
  $('#description').innerHTML=sections.map((s,i)=>`<section><h3>${i+1}. ${headings[i]}</h3><p>${escapeText(s).replace(/\n/g,'<br>')}</p></section>`).join('')+
    '<div class="wide"><table><thead><tr>'+['字段','类型','来源','时机','可编辑','默认','校验','权限','字典'].map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody><tr><td>记录名称</td><td>string</td><td>本地 rows[].name</td><td>打开编辑时</td><td>是</td><td>记录原值</td><td>非空</td><td>样例无角色系统</td><td>无</td></tr></tbody></table></div>';
  updateOutline();
}
function updateOutline(){
  $('#page-state').textContent=document.querySelector('[data-component=RK-EDITOR]')?'EDITING':'DEFAULT';
  document.querySelectorAll('[data-component]').forEach(el=>el.classList.toggle('outlined',outlined&&el.dataset.component===selected));
  const shown=[...document.querySelectorAll('[data-component]')].some(el=>el.dataset.component===selected&&el.getClientRects().length);
  $('#visibility').textContent=shown?'当前状态已展示':'该组件在当前状态下未展示';
}
function renderRows(){
  $('#records').innerHTML=model.snapshot().rows.map(r=>`<article class="card"><h3>${escapeText(r.name)}</h3><p>编号 ${r.id} · 类别 ${escapeText(r.category)}</p><button data-act="edit" data-id="${r.id}">编辑 ${r.id}</button></article>`).join('');
}
function lock(el){
  const entry=locks.get(el);
  if(entry){entry.count++;return}
  locks.set(el,{count:1,overflow:el.style.overflow,top:el.scrollTop,left:el.scrollLeft});el.style.overflow='hidden';
}
function unlock(el){
  const entry=locks.get(el);if(!entry)return;
  if(--entry.count)return;
  el.style.overflow=entry.overflow;el.scrollTop=entry.top;el.scrollLeft=entry.left;locks.delete(el);
}
function syncInert(){
  const review=stack.some(l=>l.scope==='viewport');$('#shell').inert=review;
  $('#business').inert=stack.some(l=>l.scope==='business');
  stack.forEach((l,i)=>l.element.inert=i!==stack.length-1);
}
function focusables(l){return [...l.element.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length)}
function openLayer({title,content,scope='business',parent=null,onClose=null,canClose=true}){
  const trigger=document.activeElement,element=document.createElement('div'),label=`layer-title-${++serial}`;
  element.className='layer'+(scope==='viewport'?' viewport':'');
  element.innerHTML=`<section class="panel" role="dialog" aria-modal="${scope==='viewport'}" aria-labelledby="${label}" tabindex="-1"><header class="panel-head"><h2 id="${label}">${escapeText(title)}</h2><button data-close>关闭</button></header><div class="panel-body"></div></section>`;
  const l={element,scope,parent,trigger,onClose,canClose,lockTarget:scope==='viewport'?document.documentElement:$('#business')};
  element.querySelector('.panel-body').append(content);
  (scope==='viewport'?document.body:$('#phone')).append(element);lock(l.lockTarget);stack.push(l);syncInert();
  element.querySelector('[data-close]').onclick=()=>requestClose(l);
  element.addEventListener('click',e=>{if(e.target===element)requestClose(l)});
  (focusables(l)[0]||element.querySelector('.panel')).focus();updateOutline();return l;
}
function closeLayer(l){
  if(stack.at(-1)!==l)return;
  stack.pop();l.element.remove();unlock(l.lockTarget);syncInert();
  const target=l.trigger.isConnected&&!l.trigger.closest('[inert]')?l.trigger:(stack.at(-1)?.element.querySelector('button')||$('#component'));
  target.focus({preventScroll:true});updateOutline();
}
function requestClose(l){if(stack.at(-1)!==l||!l.canClose)return;if(l.onClose)l.onClose();else closeLayer(l)}
document.addEventListener('keydown',e=>{
  const l=stack.at(-1);if(!l)return;
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();requestClose(l);return}
  // A business modal blocks its business host; outer review controls remain tools.
  if(e.key==='Tab'&&(l.scope==='viewport'||l.element.contains(document.activeElement))){
    const items=focusables(l),at=items.indexOf(document.activeElement);
    if(!items.length){e.preventDefault();l.element.querySelector('.panel').focus()}
    else if(e.shiftKey&&at<=0){e.preventDefault();items.at(-1).focus()}
    else if(!e.shiftKey&&(at<0||at===items.length-1)){e.preventDefault();items[0].focus()}
  }
},true);
function fragment(html){const t=document.createElement('template');t.innerHTML=html;return t.content}
function edit(id){
  if(stack.length)return;
  const row=model.read(id);
  if(!row){openLayer({title:'目标失效',content:fragment('<p class="error">记录不存在，未读取其他记录。请关闭后重试。</p>')});return}
  const draft={...row},token=`save-${++serial}`;
  const content=fragment('<div data-component="RK-EDITOR"><label>名称<input data-name></label><p>类别：<span data-category></span></p><button data-choice>选择类别（子层）</button><label><input type="checkbox" data-fail> 模拟保存失败</label><p data-error role="status" class="error"></p></div>');
  const l=openLayer({title:`编辑 ${id}`,content,onClose:()=>{
    if(draft.name===row.name&&draft.category===row.category){closeLayer(l);return}
    const confirm=openLayer({title:'放弃未保存修改？',parent:l,content:fragment('<p>继续编辑会保留草稿。</p><button data-keep>继续编辑</button><button data-discard>放弃修改</button>')});
    confirm.element.querySelector('[data-keep]').onclick=()=>closeLayer(confirm);
    confirm.element.querySelector('[data-discard]').onclick=()=>{closeLayer(confirm);closeLayer(l)};
  }});
  const input=l.element.querySelector('[data-name]'),category=l.element.querySelector('[data-category]');input.value=draft.name;category.textContent=draft.category;
  input.oninput=()=>draft.name=input.value;
  const save=document.createElement('button');save.textContent='保存';l.element.querySelector('[data-close]').before(save);
  save.onclick=()=>{
    const result=model.save(id,draft,token,l.element.querySelector('[data-fail]').checked);
    if(!result.ok){l.element.querySelector('[data-error]').textContent=result.error;return}
    const before=$('#business').scrollTop;closeLayer(l);renderRows();$('#business').scrollTop=before;
    // Replaced row buttons need a stable focus fallback for the same object.
    $('#records').querySelector(`[data-id="${id}"]`)?.focus({preventScroll:true});
    $('#status').textContent=`${id} 保存成功；版本 ${model.snapshot().version}，执行 ${model.snapshot().executions} 次。`;
  };
  l.element.querySelector('[data-choice]').onclick=()=>{
    const child=openLayer({title:'选择类别',parent:l,content:fragment('<p>选择后回到父表单，关闭不修改。</p><button data-value="A">类别 A</button><button data-value="B">类别 B</button>')});
    child.element.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{draft.category=b.dataset.value;category.textContent=draft.category;closeLayer(child)});
  };
}
$('#business').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b?.dataset.act==='edit')edit(b.dataset.id)});
$('#component').innerHTML=registry.map(c=>`<option value="${c.id}">${c.name}（${c.id}）</option>`).join('');
$('#component').onchange=e=>{selected=e.target.value;renderDescription()};
$('#outline').onclick=e=>{outlined=!outlined;e.currentTarget.setAttribute('aria-pressed',String(outlined));updateOutline()};
$('#container-width').onchange=e=>{$('#host').style.width=e.target.value;$('#host').style.maxWidth='100%'};
$('#snapshot').onclick=()=>$('#snapshot-output').textContent=JSON.stringify({page:'RK-01',note:$('#note').value,scroll:$('#business').scrollTop,...model.snapshot()},null,2);
$('#long-content').innerHTML=Array.from({length:8},(_,i)=>`<p>长内容 ${i+1}：滚动后查看工具是否保留正文位置。</p>`).join('');
const geometry=new ResizeObserver(()=>{const r=$('#phone').getBoundingClientRect();$('#geometry').textContent=`实测业务画布 ${r.width.toFixed(1)} × ${r.height.toFixed(1)} CSS px`});geometry.observe($('#phone'));
$('#open-diagram').onclick=()=>{
  const content=fragment('<label>缩放 <select data-zoom><option value="fit">适应宽度</option><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option></select></label><p class="note">文字太小时切回 100% 并局部滚动；本样例不设通用回退阈值。</p><div class="diagram-scroll"><div id="diagram-svg"></div></div><details><summary>PlantUML 图源</summary><pre data-source></pre></details>');
  const l=openLayer({title:'FL-RK-01 资料保存',scope:'viewport',content}),box=l.element.querySelector('.diagram-scroll');
  l.element.querySelector('#diagram-svg').append($('#diagram-template').content.cloneNode(true));
  const svg=l.element.querySelector('svg');
  const base=svg.viewBox.baseVal.width;
  function resize(){const v=l.element.querySelector('[data-zoom]').value;svg.style.width=(v==='fit'?Math.min(base,box.clientWidth):base*Number(v))+'px'}
  l.element.querySelector('[data-zoom]').onchange=resize;
  const observer=new ResizeObserver(resize);observer.observe(box);
  const oldClose=l.onClose;l.onClose=()=>{observer.disconnect();if(oldClose)oldClose();else closeLayer(l)};
  l.element.querySelector('[data-source]').textContent=DIAGRAM_SOURCE;resize();
};
const DIAGRAM_SOURCE="@startuml\nskinparam monochrome true\nskinparam shadowing false\ntitle FL-RK-01 资料保存（局部示例）\n|用户|\nstart\n:修改资料草稿;\n|本地模拟系统|\nif (目标记录仍存在?) then (是)\n  if (校验通过且模拟成功?) then (是)\n    :按稳定 ID 写回一次;\n    :更新列表并关闭编辑层;\n    stop\n  else (否)\n    :显示错误并保留草稿;\n    :允许继续编辑或重试;\n    stop\n  endif\nelse (否)\n  :显示目标失效;\n  :禁止替换为其他记录;\n  stop\nendif\n@enduml\n";
renderRows();renderDescription();
</script>
</html>
